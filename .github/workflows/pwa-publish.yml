name: Publish offline PWA
on:
    push:
        branches: [my-features]
        paths-ignore:
            - "packages/server/**"
            - "packages/server-worker/**"
            - ".github/workflows/lobby-publish.yml"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: noname-pwa-production
    cancel-in-progress: false
jobs:
    publish:
        if: github.repository == 'Nineeeeeee/noname-custom-builds' && github.ref == 'refs/heads/my-features'
        runs-on: ubuntu-latest
        environment: pwa-production
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v5
              with:
                  version: 9.15.9
                  run_install: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.13.0
                  cache: pnpm
                  cache-dependency-path: "**/pnpm-lock.yaml"
            - run: pnpm install --frozen-lockfile
            - run: npm install --global wrangler@4.147.0
            - name: Check protocols and runtime types
              run: |
                  pnpm test:pwa
                  pnpm exec tsc -p apps/core/pwa/tsconfig.json
                  pnpm exec tsc -p packages/pwa-host/tsconfig.json
            - run: pnpm build:pwa
              env:
                  NONAME_PWA_VERIFY: "0"
                  NONAME_BUILD_CHANNEL: release
                  NONAME_BUILD_COMMIT: ${{ github.sha }}
            - name: Publish current release
              run: pnpm pwa:publish -- --ci --no-verify
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: d8b2e1f89db7e58447e0ca535a1def7f
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  PWA_INVITE_CODE: ${{ secrets.PWA_INVITE_CODE }}
                  PWA_PUBLIC_ORIGIN: ${{ vars.PWA_PUBLIC_ORIGIN }}
                  GH_TOKEN: ${{ github.token }}
